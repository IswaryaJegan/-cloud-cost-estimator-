<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Cost Estimator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Cloud Cost Estimator</h1>
      <p>Estimate monthly costs across AWS, Azure, GCP</p>
    </header>

    <div class="estimator-card">
      <div class="form-group">
        <label>Cloud Provider</label>
        <select id="provider">
          <option value="aws">AWS</option>
          <option value="azure">Azure</option>
          <option value="gcp">GCP</option>
        </select>
      </div>

      <div class="form-group">
        <label>Instance Type</label>
        <select id="instanceType">
          <option value="nano">Nano / Micro (1 vCPU, 0.5-1 GB RAM)</option>
          <option value="small">Small (1-2 vCPU, 2-4 GB RAM)</option>
          <option value="medium">Medium (2-4 vCPU, 8 GB RAM)</option>
          <option value="large">Large (4-8 vCPU, 16 GB RAM)</option>
          <option value="xlarge">X-Large (8+ vCPU, 32+ GB RAM)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Storage (GB) - SSD</label>
        <input type="range" id="storage" min="0" max="2000" step="10" value="100">
        <span id="storageValue">100 GB</span>
      </div>

      <div class="form-group">
        <label>Data Transfer Out (GB/month)</label>
        <input type="range" id="dataTransfer" min="0" max="5000" step="50" value="500">
        <span id="transferValue">500 GB</span>
      </div>

      <div class="result-area">
        <h2>Estimated Monthly Cost</h2>
        <div class="cost" id="totalCost">$0.00</div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>

    <footer>
      <p>⚡ Real-time estimation • Pricing is illustrative for demo</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
